name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'marketplace/**'
      - 'crates/qimen-plugin-marketplace/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  attestations: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # 让 GitHub Pages 自己完成当前 deployment，避免新提交取消正在发布的站点。
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0

      - name: Validate and generate marketplace index
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo +1.89.0 run --locked -p qimen-plugin-marketplace --bin qimen-marketplace-index -- --verify-github marketplace docs/public/marketplace/index.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build docs
        working-directory: docs
        run: npm run docs:build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        # Pages 后端偶尔会让 deployment 永久停在 deployment_queued。
        # action 的轮询上限是 10 分钟，失败后必须创建全新的 deployment 重试。
        continue-on-error: true

      - name: Retry GitHub Pages deployment (1/2)
        id: retry_1
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Retry GitHub Pages deployment (2/2)
        id: retry_2
        if: steps.deployment.outcome == 'failure' && steps.retry_1.outcome == 'failure'
        uses: actions/deploy-pages@v4
