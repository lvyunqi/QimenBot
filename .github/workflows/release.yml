name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: 1.89.0
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            daemon: qimenbotd
            entry: qimenbot
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            daemon: qimenbotd
            entry: qimenbot
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            daemon: qimenbotd
            entry: qimenbot
          - target: x86_64-apple-darwin
            os: macos-latest
            daemon: qimenbotd
            entry: qimenbot
          - target: aarch64-apple-darwin
            os: macos-latest
            daemon: qimenbotd
            entry: qimenbot
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            daemon: qimenbotd.exe
            entry: qimenbot.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        if: ${{ !endsWith(matrix.target, 'linux-gnu') }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/admin/package-lock.json

      - name: Build admin web
        working-directory: web/admin
        run: |
          npm ci
          npm run build

      - name: Build GNU/Linux with glibc 2.31
        if: ${{ endsWith(matrix.target, 'linux-gnu') }}
        env:
          RUST_BULLSEYE_IMAGE: rust:1.89.0-bullseye@sha256:8f72d971a31b278cebdb2eb64a44c3900ff27c716a4ef6f4db05946d10c9ae4e
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/src" \
            --workdir /src \
            --env "TARGET=${{ matrix.target }}" \
            --env "RUSTUP_TOOLCHAIN=${RUSTUP_TOOLCHAIN}" \
            "${RUST_BULLSEYE_IMAGE}" \
            bash -euxo pipefail -c '
              rustup target add --toolchain "${RUSTUP_TOOLCHAIN}" "${TARGET}"
              if [ "${TARGET}" = "aarch64-unknown-linux-gnu" ]; then
                apt-get update
                DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
                  gcc-aarch64-linux-gnu \
                  libc6-dev-arm64-cross
                export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
                export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
              fi
              cargo +1.89.0 build --locked --release --target "${TARGET}" --package qimenbotd --package qimenbot
            '

      - name: Verify GNU/Linux glibc compatibility
        if: ${{ endsWith(matrix.target, 'linux-gnu') }}
        run: |
          for binary in \
            "target/${{ matrix.target }}/release/${{ matrix.daemon }}" \
            "target/${{ matrix.target }}/release/${{ matrix.entry }}"; do
            required="$(readelf --version-info "${binary}" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -n 1)"
            echo "${binary}: maximum required ${required}"
            highest="$(printf '%s\n' "GLIBC_2.31" "${required}" | sort -V | tail -n 1)"
            test "${highest}" = "GLIBC_2.31"
          done

      - name: Build native target
        if: ${{ !endsWith(matrix.target, 'linux-gnu') }}
        run: cargo +1.89.0 build --locked --release --target ${{ matrix.target }} --package qimenbotd --package qimenbot

      - name: Prepare release assets (Unix)
        if: runner.os != 'Windows'
        run: |
          VERSION="${GITHUB_REF_NAME}"
          TARGET="${{ matrix.target }}"
          DIR="QimenBot-${VERSION}-${TARGET}"
          PACKAGE_ASSET="${DIR}.tar.gz"
          DAEMON_ASSET="qimenbotd-${VERSION}-${TARGET}"
          mkdir -p "${DIR}/config/plugins" "${DIR}/plugins/bin" "${DIR}/runtime" release-assets
          cp "target/${TARGET}/release/${{ matrix.daemon }}" "${DIR}/runtime/qimenbotd"
          cp "target/${TARGET}/release/${{ matrix.entry }}" "${DIR}/qimenbot"
          cp config/base.toml "${DIR}/config/base.toml.example"
          cp deploy/release/qimenbot.toml.example "${DIR}/config/qimenbot.toml.example"
          cp config/plugin-state.toml "${DIR}/config/"
          cp deploy/release/README.txt "${DIR}/"
          touch "${DIR}/config/plugins/.gitkeep"
          touch "${DIR}/plugins/bin/.gitkeep"
          tar czf "release-assets/${PACKAGE_ASSET}" "${DIR}"
          cp "target/${TARGET}/release/${{ matrix.daemon }}" "release-assets/${DAEMON_ASSET}"
          (
            cd release-assets
            sha256sum "${PACKAGE_ASSET}" > "${PACKAGE_ASSET}.sha256"
            sha256sum "${DAEMON_ASSET}" > "${DAEMON_ASSET}.sha256"
          )

      - name: Prepare release assets (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VERSION = "${{ github.ref_name }}"
          $TARGET = "${{ matrix.target }}"
          $DIR = "QimenBot-${VERSION}-${TARGET}"
          $PACKAGE_ASSET = "${DIR}.zip"
          $DAEMON_ASSET = "qimenbotd-${VERSION}-${TARGET}.exe"
          New-Item -ItemType Directory -Force -Path "${DIR}/config/plugins", "${DIR}/plugins/bin", "${DIR}/runtime", "release-assets"
          Copy-Item "target/${TARGET}/release/${{ matrix.daemon }}" "${DIR}/runtime/qimenbotd.exe"
          Copy-Item "target/${TARGET}/release/${{ matrix.entry }}" "${DIR}/qimenbot.exe"
          Copy-Item "config/base.toml" "${DIR}/config/base.toml.example"
          Copy-Item "deploy/release/qimenbot.toml.example" "${DIR}/config/qimenbot.toml.example"
          Copy-Item "config/plugin-state.toml" "${DIR}/config/"
          Copy-Item "deploy/release/README.txt" "${DIR}/"
          New-Item -ItemType File -Force -Path "${DIR}/config/plugins/.gitkeep"
          New-Item -ItemType File -Force -Path "${DIR}/plugins/bin/.gitkeep"
          Compress-Archive -Path "${DIR}" -DestinationPath "release-assets/${PACKAGE_ASSET}"
          Copy-Item "target/${TARGET}/release/${{ matrix.daemon }}" "release-assets/${DAEMON_ASSET}"
          $packageHash = (Get-FileHash "release-assets/${PACKAGE_ASSET}" -Algorithm SHA256).Hash.ToLower()
          $daemonHash = (Get-FileHash "release-assets/${DAEMON_ASSET}" -Algorithm SHA256).Hash.ToLower()
          "${packageHash}  ${PACKAGE_ASSET}" | Set-Content -Encoding ascii "release-assets/${PACKAGE_ASSET}.sha256"
          "${daemonHash}  ${DAEMON_ASSET}" | Set-Content -Encoding ascii "release-assets/${DAEMON_ASSET}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release-assets/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: QimenBot ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## 下载说明

            普通用户只需要下载与系统对应的 `QimenBot-*.zip` 或 `QimenBot-*.tar.gz` 完整安装包，解压后运行 `qimenbot`。

            `qimenbotd-*` 及其校验文件仅用于兼容已有安装的核心自动更新，不用于首次安装。

            使用动态插件的 Linux 用户请选择与 CPU 架构对应的 `*-unknown-linux-gnu` 完整包或 Docker。静态链接的 `x86_64-unknown-linux-musl` 包不能加载 `.so` 动态插件。
          files: artifacts/*
