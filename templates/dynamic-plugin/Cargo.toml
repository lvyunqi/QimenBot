[package]
name = "qimen-dynamic-plugin-template"
edition = "2024"
version = "0.1.0"
rust-version = "1.89"

# 在 QimenBot 源码树内用空 workspace 隔离根工作区；复制到仓库外后可删除。
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# 两个 QimenBot 配套 crate 必须使用同一版本。
abi-stable-host-api = "0.1.13"
abi_stable = "0.11"
serde_json = "1"
qimen-dynamic-plugin-derive = "0.1.13"

# 按需添加其他依赖：
# serde = { version = "1", features = ["derive"] }
# tracing = "0.1"
# rusqlite = { version = "0.34", features = ["bundled"] }
