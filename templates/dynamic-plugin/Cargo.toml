[package]
name = "qimen-dynamic-plugin-template"
edition = "2024"
version = "0.1.0"
rust-version = "1.89"

# 在 QimenBot 源码树内用空 workspace 隔离根工作区；复制到仓库外后可删除。
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# API 0.6 配套 crate 尚未发布，暂时固定到公开的 QimenBot 源码提交。
# 正式版本发布后请按 README 将两个依赖一起切换到同一 crates.io 版本。
abi-stable-host-api = { git = "https://github.com/lvyunqi/QimenBot.git", rev = "f6aa64841a6afca024b8f6e99b2945f05c1f007a" }
abi_stable = "0.11"
serde_json = "1"
qimen-dynamic-plugin-derive = { git = "https://github.com/lvyunqi/QimenBot.git", rev = "f6aa64841a6afca024b8f6e99b2945f05c1f007a" }

# 按需添加其他依赖：
# serde = { version = "1", features = ["derive"] }
# tracing = "0.1"
# rusqlite = { version = "0.34", features = ["bundled"] }
