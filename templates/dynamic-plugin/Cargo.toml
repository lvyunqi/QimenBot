[package]
name = "qimen-dynamic-plugin-{{name}}"
edition = "2024"
version = "0.1.0"
rust-version = "1.89"

# 在 QimenBot 源码树内用空 workspace 隔离根工作区；复制到仓库外后可删除。
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# API 0.6 配套 crate 尚未发布，仓库内模板使用 path 依赖保证它与宿主源码一致。
# 复制到独立仓库前请按 README 核对正式版本，不要把 crates.io 0.1.12 当作 API 0.6。
abi-stable-host-api = { path = "../../crates/abi-stable-host-api" }
abi_stable = "0.11"
serde_json = "1"
qimen-dynamic-plugin-derive = { path = "../../crates/qimen-dynamic-plugin-derive" }

# 按需添加其他依赖：
# serde = { version = "1", features = ["derive"] }
# tracing = "0.1"
# rusqlite = { version = "0.34", features = ["bundled"] }
