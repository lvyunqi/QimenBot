# ============================================================================
# 插件启用/禁用状态持久化 / Plugin State Persistence
# ============================================================================
# 此文件由框架自动管理，记录各插件的启用/禁用状态和命令优先级。
# 通过 Web 管理面板或管理 API 修改后，变更会保存在这里。
# 重启后框架会读取此文件恢复插件状态。
#
# 格式：module_id = true/false
#   true  = 启用
#   false = 禁用
#
# 如果某个插件在 base.toml 的 plugin_modules 中声明了，
# 但这里设为 false，则该插件不会被加载。

[modules]
"example-plugin" = true

# 同名命令冲突时，数值较大的插件优先。有效范围为 0 到 1000。
# 未写入时使用默认值：静态插件 30，动态插件 20。
# 建议在 Web 管理面板的“插件”页面修改，避免运行时覆盖手工编辑。
# [priorities]
# "example-plugin" = 30
